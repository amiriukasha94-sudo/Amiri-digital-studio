<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amiri Studio — Admin</title><link rel="stylesheet" href="styles.css"><style>body{padding:28px;max-width:1000px;margin:auto}main{padding:30px 0}.panel{border:1px solid #ffffff25;padding:20px;margin:16px 0;background:#ffffff08}.panel label{display:grid;gap:8px;margin:12px 0;color:#e2d1ae}.panel input{padding:12px;background:#111;color:white;border:1px solid #777}.record{border:1px solid #ffffff25;padding:16px;margin:12px 0;overflow-wrap:anywhere}.record pre{white-space:pre-wrap;font:12px/1.6 sans-serif;color:#ddd}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{color:#e5c98e}button{cursor:pointer}</style></head><body><header><a class="brand" href="/"><b>A</b><span>AMIRI<small>DIGITAL STUDIO</small></span></a><a href="/">View website ↗</a></header><main><p class="eyebrow">PRIVATE OWNER AREA</p><h1>Payment <em>management</em></h1><p>Only approve a payment after checking the transaction in your MTN account. A submitted reference is not proof of payment.</p><section class="panel" id="login"><label>Admin access key<input id="key" type="password" autocomplete="current-password" placeholder="Enter the key configured in Netlify"></label><button class="btn gold" id="loginBtn">Open dashboard</button><p id="loginStatus" role="status"></p></section><section id="dashboard" hidden><div class="actions"><button class="btn gold" id="refresh">Refresh payments</button><button class="btn outline" id="logout">Log out</button></div><p class="status" id="summary"></p><div id="records"></div></section></main><script>
const $=s=>document.querySelector(s);let key="";
async function load(){const box=$("#records");box.textContent="Loading…";try{const r=await fetch("/.netlify/functions/admin-payments",{headers:{"X-Admin-Key":key}}),j=await r.json();if(!r.ok)throw Error(j.error||"Unable to load");$("#summary").textContent=j.records.length+" payment submissions";box.innerHTML=j.records.length?j.records.map(x=>'<article class="record"><b>'+esc(x.name)+' — '+esc(x.business)+'</b><p>'+esc(x.phone)+'</p><pre>'+esc(x.notes)+'</pre><div class="actions"><button class="btn gold" data-id="'+esc(x.id)+'" data-decision="VERIFIED">Verify payment</button><button class="btn outline" data-id="'+esc(x.id)+'" data-decision="REJECTED">Reject</button></div></article>').join(""):"<p>No payment submissions yet.</p>";}catch(e){box.textContent=e.message;}}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("#loginBtn").onclick=()=>{key=$("#key").value.trim();if(!key){$("#loginStatus").textContent="Enter your admin key.";return;}$("#login").hidden=true;$("#dashboard").hidden=false;load();};
$("#refresh").onclick=load;$("#logout").onclick=()=>{key="";$("#key").value="";$("#dashboard").hidden=true;$("#login").hidden=false;};
$("#records").onclick=async e=>{const b=e.target.closest("button[data-id]");if(!b)return;if(!confirm("Have you personally checked the MTN transaction history and confirmed the exact amount and transaction ID?"))return;b.disabled=true;try{const r=await fetch("/.netlify/functions/admin-payments",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":key},body:JSON.stringify({recordId:b.dataset.id,decision:b.dataset.decision})}),j=await r.json();if(!r.ok)throw Error(j.error||"Update failed");await load();}catch(err){alert(err.message);b.disabled=false;}};
</script></body></html>
