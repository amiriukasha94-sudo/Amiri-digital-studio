<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Website</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#101010;color:#f8f4ec;font:16px system-ui,Arial}header,main,footer{max-width:900px;margin:auto;padding:22px}header{border-bottom:1px solid #444}h1,h2{color:var(--brand,#d9ae5d)}.hero{padding:60px 22px;text-align:center;background:#1a1a1a;border-radius:18px;margin-top:22px}.card{padding:18px;border:1px solid #444;border-radius:12px;margin:14px 0}.muted{color:#aaa}a,button{color:#111;background:var(--brand,#d9ae5d);padding:11px 16px;border-radius:8px;text-decoration:none;border:0;font-weight:700;display:inline-block;margin:5px 0}li{margin:8px 0}img{max-width:100%;max-height:280px;object-fit:contain}#error{color:#ff9d9d}#contact{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:1000;border-radius:999px;padding:14px 20px;box-shadow:0 8px 28px #0008} @media(max-width:600px){#contact{right:12px;padding:12px 15px;font-size:14px}}</style></head><body><header><strong id="brand">Business website</strong></header><main><p id="error"></p><section class="hero"><img id="logo" hidden alt="Business logo"><h1 id="name">Loading website…</h1><p id="tagline"></p><p id="location"></p><a id="contact" hidden>Contact business</a></section><section class="card"><h2>About us</h2><p id="about"></p></section><section class="card"><h2>Services & products</h2><ul id="services"></ul></section><section class="card"><h2>Payment information</h2><p id="methods"></p><p id="instructions"></p></section></main><footer class="muted">Website powered by Amiri Digital Studio</footer><script>const sb=window.supabase.createClient("https://lsbaldpeillqsmmaplef.supabase.co","sb_publishable_GLO9G1rXCNG6ax4qltqOSw__YCv9jMq");const $=id=>document.getElementById(id);const param=new URLSearchParams(location.search).get("site");async function load(){if(!param){$("error").textContent="Website address is missing.";return}const {data:w,error}=await sb.from("customer_websites").select("id,site_name,slug,status,public_settings").eq("slug",param).eq("status","published").maybeSingle();if(error||!w){$("error").textContent="This website is not available or has not been published.";return}const p=w.public_settings||{};document.title=w.site_name;$("brand").textContent=w.site_name;$("name").textContent=w.site_name;$("tagline").textContent=p.tagline||"";$("location").textContent=p.location||"";$("about").textContent=p.about||"";document.documentElement.style.setProperty("--brand",p.brand_color||"#d9ae5d");if(p.image_url){$("logo").src=p.image_url;$("logo").hidden=false}if(p.phone){$("contact").href="https://wa.me/"+p.phone.replace(/\D/g,"");$("contact").textContent="Contact on WhatsApp";$("contact").hidden=false}for(const s of p.services||[]){const li=document.createElement("li");li.textContent=s;$("services").append(li)}const {data:pay}=await sb.from("customer_website_payments").select("currency,methods,receiving_contacts,payment_instructions").eq("website_id",w.id).maybeSingle();if(pay){const r=pay.receiving_contacts||{};const lines=[];if(r.mtn)lines.push("MTN Mobile Money: "+r.mtn);if(r.airtel)lines.push("Airtel Money: "+r.airtel);if(r.bank)lines.push("Bank: "+r.bank);$("methods").textContent=lines.join(" · ")||"Contact the business for payment options."; $("instructions").textContent=pay.payment_instructions||""}else{$("methods").textContent="Contact the business for payment options."}}load();</script></body></html>
