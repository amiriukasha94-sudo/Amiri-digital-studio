<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Website draft review | Amiri Digital Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0c0c;color:#f4f0e7;font:15px/1.5 system-ui,sans-serif}.top{padding:18px 5%;border-bottom:1px solid #b9914b55;display:flex;justify-content:space-between;gap:15px;align-items:center}.gold{color:#e6c27c}.wrap{max-width:1200px;margin:auto;padding:28px 4%}.meta{color:#aaa;font-size:13px}.frame{height:72vh;min-height:480px;background:#fff;border-radius:12px;overflow:hidden;margin:18px 0}.frame iframe{width:100%;height:100%;border:0}.panel{background:#151717;border:1px solid #b9914b44;border-radius:12px;padding:20px}.panel textarea{width:100%;min-height:90px;background:#090a0a;color:white;border:1px solid #555;border-radius:8px;padding:12px;font:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}.approve{background:#e6c27c;color:#15120b}.changes{background:#292d2d;color:#fff}.status{color:#e6c27c;font-size:13px;margin-top:12px}@media(max-width:600px){.frame{height:65vh;min-height:420px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><b>AMIRI <span class="gold">DIGITAL STUDIO</span></b><span class="meta">Private website draft review</span></header><main class="wrap"><h1 id="title">Loading your website draft…</h1><p class="meta" id="details">Opening secure preview</p><p class="meta" id="history"></p><div class="frame"><iframe id="preview" title="Website draft" sandbox="allow-scripts allow-forms allow-popups"></iframe></div><section class="panel"><h2>Review this website</h2><p class="meta">Approve this draft for the next project stage, or request changes. Approval here means you approve the design draft; it does not publish the website or confirm payment.</p><textarea id="feedback" maxlength="2000" placeholder="Write approval notes or list the changes you want…"></textarea><div class="actions"><button class="approve" id="approve">Approve design</button><button class="changes" id="request">Request changes</button></div><p class="status" id="status" role="status"></p></section></main><script>
const token=new URLSearchParams(location.search).get("t");const $=id=>document.getElementById(id);let draft;
async function api(url,opts={}){const r=await fetch(url,opts);const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d;}
(async()=>{try{if(!token)throw Error("Missing private draft token.");const d=await api("/.netlify/functions/drafts?token="+encodeURIComponent(token));draft=d.draft;$("history").textContent="Revision history: "+(d.revisions||[]).map(x=>"v"+x.revision_number+" ("+new Date(x.created_at).toLocaleString()+")").join(" · ");$("title").textContent=draft.business_name||"Your website draft";$("details").textContent="Prepared for "+(draft.client_name||"client")+" · "+draft.status.replaceAll("_"," ")+" · Link expires "+new Date(draft.expires_at).toLocaleDateString();$("preview").srcdoc=draft.html_content;$("feedback").value=draft.client_feedback||"";}catch(e){$("title").textContent="Draft unavailable";$("details").textContent=e.message;$("approve").disabled=$("request").disabled=true;}})();
async function feedback(decision){try{const note=$("feedback").value.trim();if(note.length<3)throw Error("Please add a short note before submitting.");const d=await api("/.netlify/functions/drafts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"feedback",token,decision,feedback:note})});$("status").textContent=decision==="approve"?"Design approval sent to Amiri. The website is not published yet.":"Change request sent to Amiri."; }catch(e){$("status").textContent=e.message;}}
$("approve").onclick=()=>feedback("approve");$("request").onclick=()=>feedback("changes");
</script></body></html>
