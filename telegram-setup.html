<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Telegram setup | Amiri Digital Studio</title><style>body{font:16px system-ui;background:#090909;color:#eee;max-width:560px;margin:10vh auto;padding:24px}main{border:1px solid #80652c;border-radius:16px;padding:24px}h1{color:#d8b66b}input,button{box-sizing:border-box;width:100%;padding:14px;margin:10px 0;border-radius:8px}input{background:#171717;color:#fff;border:1px solid #555}button{background:#d8b66b;border:0;font-weight:700}p{line-height:1.5}#status{white-space:pre-wrap}</style></head>
<body><main><h1>Connect Telegram approvals</h1><p>Enter the same <b>TELEGRAM_WEBHOOK_SECRET</b> you saved in Netlify. It is sent securely to your site's setup function and is not stored in this page.</p><form id="setup"><label>Webhook secret<input id="secret" type="password" autocomplete="off" required minlength="32"></label><button id="go">Register Telegram webhook</button></form><p id="status" role="status"></p></main><script>
document.querySelector("#setup").addEventListener("submit",async e=>{e.preventDefault();const b=document.querySelector("#go"),s=document.querySelector("#status"),v=document.querySelector("#secret").value;b.disabled=true;b.textContent="Registering…";s.textContent="Contacting Telegram…";try{const r=await fetch("/.netlify/functions/setup-telegram-webhook",{method:"POST",headers:{"x-setup-secret":v}});const d=await r.json();if(!r.ok)throw Error(d.error||"Setup failed");s.textContent="Success: "+d.description+"\\nWebhook: "+d.webhook+"\\nYou can close this page.";document.querySelector("#secret").value="";}catch(err){s.textContent="Error: "+err.message;b.disabled=false;b.textContent="Try again";}});
</script></body></html>
