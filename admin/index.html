<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Amiri Owner Console</title><style>
body{margin:0;background:#090909;color:#f7f2e8;font:15px Arial,sans-serif}header,main{max-width:1100px;margin:auto;padding:24px}header{border-bottom:1px solid #333;color:#d9ae5d}h1,h2{font-family:Georgia,serif}section,.panel{background:#171717;border:1px solid #333;border-radius:14px;padding:22px;margin:18px 0}label{display:block;color:#ccc;margin:10px 0}input,select{display:block;width:100%;padding:12px;margin-top:6px;background:#090909;color:white;border:1px solid #444;border-radius:8px;box-sizing:border-box}button{padding:12px 18px;background:#d9ae5d;border:0;border-radius:8px;font-weight:bold;margin:8px 5px 8px 0}.muted{color:#aaa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.license{border:1px solid #444;padding:14px;border-radius:10px;margin:12px 0}.hidden{display:none!important}#message{color:#e6c77f}
</style></head><body><header><b>AMIRI DIGITAL STUDIO / OWNER CONSOLE</b></header><main>
<section id="login"><p>RESTRICTED ACCESS</p><h1>Owner sign in</h1><p class="muted">Use your verified Supabase owner account. No shared or hard-coded admin password.</p><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in securely</button></form><p id="loginMessage"></p></section>
<section id="app" class="hidden"><h1>Investor licences</h1><button id="logout">Sign out</button><div class="panel"><h2>Create licence</h2><form id="createForm"><div class="grid"><label>Legal entity<input name="legal_entity" required></label><label>Contact email<input name="contact_email" type="email" required></label><label>Model<select name="model"><option value="white_label">White-label</option><option value="franchise">Franchise</option><option value="enterprise">Enterprise</option></select></label><label>Tier<select name="tier"><option value="reseller">Reseller</option><option value="business_partner">Business partner</option><option value="regional_operator">Regional operator</option><option value="enterprise">Enterprise</option></select></label><label>Territory<input name="territory"></label><label>Setup fee UGX<input name="setup_fee_ugx" type="number" min="0" value="0"></label><label>Recurring fee UGX<input name="recurring_fee_ugx" type="number" min="0" value="0"></label><label>Billing<select name="billing_period"><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="yearly">Yearly</option><option value="custom">Custom</option></select></label></div><button>Create pending licence</button></form></div>
<div class="panel"><h2>Brand workspace</h2><form id="brandForm"><label>Licence<select name="license_id" id="brandLicense" required></select></label><div class="grid"><label>Brand name<input name="brand_name" required></label><label>Logo URL<input name="logo_url" type="url"></label><label>Custom domain<input name="primary_domain"></label><label>Primary colour<input name="primary_colour" placeholder="#D9AE5D"></label></div><button>Save brand settings</button></form></div>
<div class="panel"><h2>All licences</h2><button id="refresh">Refresh</button><div id="licenses"></div></div><p id="message"></p></section></main>
<script>
const api='/.netlify/functions/owner-admin';let token='';const $=id=>document.getElementById(id);
async function call(method='GET',body){const endpoint=body&&body.action==='login'?api+'?action=login':api;const r=await fetch(endpoint,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMessage').textContent='Signing in…';const f=new FormData(e.target);try{const d=await call('POST',{action:'login',email:f.get('email'),password:f.get('password')});token=d.access_token;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(x){$('loginMessage').textContent=x.message}};
async function load(){try{const d=await call();const ls=d.licenses||[];$('licenses').innerHTML=ls.map(l=>'<div class="license"><b>'+safe(l.legal_entity)+'</b><p class="muted">'+safe(l.license_code)+' · '+safe(l.model)+' · '+safe(l.tier)+' · '+safe(l.status)+'</p><select data-status="'+l.id+'"><option>pending</option><option>active</option><option>suspended</option><option>expired</option><option>terminated</option></select><button data-save="'+l.id+'">Update status</button></div>').join('')||'<p class="muted">No licences yet.</p>';$('brandLicense').innerHTML=ls.map(l=>'<option value="'+l.id+'">'+safe(l.license_code)+' — '+safe(l.legal_entity)+'</option>').join('')}catch(x){$('message').textContent=x.message}}
$('createForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.action='create';try{const d=await call('POST',b);$('message').textContent='Created pending licence '+d.license.license_code;e.target.reset();await load()}catch(x){$('message').textContent=x.message}};
$('brandForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));b.action='brand';try{await call('POST',b);$('message').textContent='Brand workspace saved';await load()}catch(x){$('message').textContent=x.message}};
$('licenses').onclick=async e=>{const id=e.target.dataset.save;if(!id)return;const status=$('licenses').querySelector('[data-status="'+id+'"]').value;try{await call('POST',{action:'status',id,status});$('message').textContent='Licence status updated';await load()}catch(x){$('message').textContent=x.message}};
$('refresh').onclick=load;$('logout').onclick=()=>{token='';$('app').classList.add('hidden');$('login').classList.remove('hidden')};
</script></body></html>
