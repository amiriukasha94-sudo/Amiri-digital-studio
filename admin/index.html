<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090909"><title>Amiri Digital Studio | Admin</title>
<style>
:root{color-scheme:dark;--gold:#d9ae5d;--panel:#151515;--line:#333}*{box-sizing:border-box}body{margin:0;background:#090909;color:#f7f2e8;font:15px system-ui,Arial}header{padding:20px max(20px,calc((100% - 1120px)/2));border-bottom:1px solid var(--line);color:var(--gold);font-weight:700}main{max-width:1120px;margin:auto;padding:24px}section,.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}input,select,textarea{width:100%;padding:12px;margin:7px 0 13px;background:#080808;color:white;border:1px solid #444;border-radius:7px}button{padding:11px 15px;background:var(--gold);color:#111;border:0;border-radius:7px;font-weight:700;cursor:pointer;margin:4px}button.secondary{background:#333;color:white}.hidden{display:none!important}.muted{color:#aaa}.notice{white-space:pre-wrap;color:#e8c986}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;color:var(--gold)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{font-size:12px;color:var(--gold);letter-spacing:1px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button.active{outline:2px solid var(--gold)}.status{border:1px solid #555;border-radius:20px;padding:4px 8px;font-size:12px}label{display:block;color:#ccc}pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<header>AMIRI DIGITAL STUDIO · OWNER ADMIN</header><main>
<section id="login"><p class="tag">PRIVATE OWNER ACCESS</p><h1>Admin login</h1><p class="muted">Enter your owner password to continue.</p><form id="loginForm"><label>Owner password<input name="password" type="password" autocomplete="current-password" required autofocus></label><button id="loginBtn">Unlock admin panel</button></form><p id="loginMsg" class="notice" role="status"></p></section>
<div id="app" class="hidden"><div class="row"><div><p class="tag">CONTROL CENTRE</p><h1>Dashboard</h1><p class="muted">Orders, quotations and project updates.</p></div><button class="secondary" id="logout">Lock panel</button></div>
<div class="grid"><section>Orders<div class="stat" id="ordersN">—</div></section><section>Quotations<div class="stat" id="quotesN">—</div></section><section>Active projects<div class="stat" id="activeN">—</div></section></div>
<div class="tabs"><button class="active" data-tab="orders">Orders</button><button data-tab="quotes">Quotations</button><button data-tab="updates">Project updates</button></div>
<section><div class="row"><h2 id="heading">Orders</h2><button class="secondary" id="refresh">Refresh</button></div><div id="records">Loading…</div></section><p id="appMsg" class="notice" role="status"></p></div></main>
<script>
const API="/.netlify/functions/owner-admin";let token=sessionStorage.getItem("amiri_admin_token")||"",orders=[],quotations=[],updates=[],tab="orders";
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function call(action,data={},method="POST"){const res=await fetch(API,{method,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})},body:method==="GET"?undefined:JSON.stringify({action,...data})});const out=await res.json().catch(()=>({error:"Server returned an invalid response."}));if(!res.ok)throw Error(out.error||"Request failed.");return out;}
function message(t){$("appMsg").textContent=t}
async function load(){message("Loading records…");const d=await call("dashboard");orders=d.orders||[];quotations=d.quotations||[];updates=d.updates||[];$("ordersN").textContent=orders.length;$("quotesN").textContent=quotations.length;$("activeN").textContent=orders.filter(x=>!["completed","cancelled"].includes(x.status)).length;render();message("Records loaded.");}
function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("heading").textContent=tab==="orders"?"Orders":tab==="quotes"?"Quotations":"Project updates";let html="";
if(tab==="orders")html=orders.length?orders.map(o=>'<article class="item"><div class="row"><b>'+esc(o.title||o.service_type||"Customer order")+'</b><span class="status">'+esc(o.status)+'</span></div><p class="muted">'+esc(o.service_type)+' · '+esc(o.budget_currency||"UGX")+' '+esc(o.budget_amount??"Budget not stated")+' · Deadline '+esc(o.deadline||"Not set")+'</p><p>'+esc(o.brief||"No brief")+'</p><details><summary>Preferences</summary><pre>'+esc(JSON.stringify(o.preferences||{},null,2))+'</pre></details><label>Order status<select data-status="'+esc(o.id)+'">'+["submitted","reviewing","quoted","approved","in_progress","review","completed","cancelled"].map(s=>'<option '+(o.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select></label><button data-save="'+esc(o.id)+'">Save status</button><button class="secondary" data-quote="'+esc(o.id)+'">Create quotation</button></article>').join(""):"<p>No orders yet.</p>";
if(tab==="quotes")html=quotations.length?quotations.map(q=>'<article class="item"><b>UGX '+esc(q.amount)+'</b> <span class="status">'+esc(q.status)+'</span><p>Order '+esc(q.order_id)+' · Version '+esc(q.version)+'</p><p>'+esc(q.scope)+'</p><p class="muted">'+esc(q.terms)+'</p></article>').join(""):"<p>No quotations yet.</p>";
if(tab==="updates")html=updates.length?updates.map(u=>'<article class="item"><b>'+esc(u.status||"Update")+'</b><p>'+esc(u.message)+'</p><small class="muted">Order '+esc(u.order_id)+'</small></article>').join(""):"<p>No updates yet.</p>";
$("records").innerHTML=html;}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginBtn").disabled=true;$("loginMsg").textContent="Checking password…";try{const password=new FormData(e.target).get("password");const d=await call("login",{password});token=d.token;sessionStorage.setItem("amiri_admin_token",token);$("login").classList.add("hidden");$("app").classList.remove("hidden");e.target.reset();await load();}catch(err){$("loginMsg").textContent=err.message;}finally{$("loginBtn").disabled=false;}});
$("logout").onclick=()=>{token="";sessionStorage.removeItem("amiri_admin_token");$("app").classList.add("hidden");$("login").classList.remove("hidden");$("loginMsg").textContent="Admin panel locked.";};
$("refresh").onclick=()=>load().catch(e=>message(e.message));
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$("records").addEventListener("click",async e=>{try{if(e.target.dataset.save){const id=e.target.dataset.save,status=$("records").querySelector('[data-status="'+CSS.escape(id)+'"]').value;await call("update_order",{id,status},"PATCH");await load();return;}if(e.target.dataset.quote){const order_id=e.target.dataset.quote,amount=prompt("Quotation amount in UGX:");if(amount===null)return;const scope=prompt("Quotation scope and deliverables:");if(scope===null)return;const terms=prompt("Payment terms:","50% deposit, balance on completion");if(terms===null)return;await call("create_quotation",{order_id,amount,scope,terms});await load();message("Quotation saved successfully.");}}catch(err){message(err.message);}});
(async()=>{if(token){try{$("login").classList.add("hidden");$("app").classList.remove("hidden");await load();}catch(e){token="";sessionStorage.removeItem("amiri_admin_token");$("app").classList.add("hidden");$("login").classList.remove("hidden");$("loginMsg").textContent=e.message;}}})();
</script></body></html>
